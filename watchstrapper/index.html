<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchStrapper by Justus Verhagen</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&display=swap");

:root {
  --bench: #d9dfdc;
  --ink: #1c2a2d;
  --petrol: #1f5c63;
  --mat: #a9b7b3;
  --line: #b3beba;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bench);
  color: var(--ink);
  font: 16px/1.45 "Bricolage Grotesque", system-ui, sans-serif;
}
main { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 2rem; font-weight: 600; margin: 0 0 16px; letter-spacing: -0.02em; }
h2 { font-size: 1.1rem; font-weight: 600; margin: 32px 0 10px; }

.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .inputs { grid-template-columns: 1fr; } }

.zone {
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px; min-height: 120px;
  border: 1.5px dashed var(--line); border-radius: 10px;
  background: rgba(255,255,255,.35);
}
.zone b { font-weight: 600; }
.zone span { font-size: .9rem; opacity: .8; }
.zone.over { border-color: var(--petrol); background: rgba(31,92,99,.12); }

.url { display: flex; gap: 6px; margin-top: auto; }
.url input { flex: 1; min-width: 0; }
input[type=url] {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
  font: inherit; background: #fff; color: var(--ink);
}
button {
  font: inherit; padding: 8px 14px; border: 0; border-radius: 6px;
  background: var(--petrol); color: #fff; cursor: pointer;
}
.pick {
  position: relative; overflow: hidden; align-self: flex-start;
  padding: 8px 14px; border: 1px solid var(--petrol); border-radius: 6px;
  color: var(--petrol); cursor: pointer; margin-top: auto;
}
.pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.pick:focus-within { outline: 2px solid var(--petrol); outline-offset: 2px; }
button.ghost { background: transparent; color: var(--petrol); border: 1px solid var(--petrol); align-self: flex-start; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }

#status { min-height: 1.5em; margin: 12px 0; font-size: .9rem; }
#status.err { color: #9a2b1f; }

.stageWrap {
  background: radial-gradient(circle at 50% 40%, #bcc8c4, var(--mat));
  border-radius: 12px; padding: 16px; display: flex; justify-content: center;
}
#stage { width: 100%; height: 72vh; object-fit: contain; display: block; }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.controls label { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.controls input[type=range] { width: 180px; accent-color: var(--petrol); }

.chk { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
.target { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: .9rem; }
.target span { margin-right: 4px; }
.target button { background: transparent; color: var(--petrol); border: 1px solid var(--petrol); padding: 5px 12px; }
.target button.on { background: var(--petrol); color: #fff; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; }
.strip button {
  flex: none; width: 64px; height: 84px; padding: 4px;
  background: #fff; border: 2px solid transparent; border-radius: 8px;
}
.strip button.on { border-color: var(--petrol); }
.strip img { width: 100%; height: 100%; object-fit: contain; display: block; }

.pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pins figure { margin: 0; background: var(--mat); border-radius: 8px; padding: 8px; cursor: pointer; }
.pins img { width: 100%; display: block; }
.empty { opacity: .7; font-size: .9rem; margin: 0; }

</style>
</head>
<body>
<main>
  <h1>WatchStrapper by Justus Verhagen</h1>

  <section class="inputs">
    <div class="zone" id="watchZone">
      <b>Watch</b>
      <span>Drop a front view with no strap, or choose a file</span>
      <label class="pick">Choose file
        <input type="file" id="watchFile" accept="image/*">
      </label>
    </div>

    <div class="zone" id="strapZone">
      <b>Strap</b>
      <span>Drop an image, paste one, paste a direct link, or choose files</span>
      <div class="url">
        <input id="urlIn" type="url" placeholder="https://…/strap.jpg">
        <button id="urlGo">Add</button>
      </div>
      <label class="pick">Choose files
        <input type="file" id="strapFile" accept="image/*" multiple>
      </label>
    </div>
  </section>

  <p id="status" role="status">Add a watch to begin.</p>

  <div class="stageWrap"><canvas id="stage" width="10" height="10"></canvas></div>

  <div class="controls">
    <label>Lug gap
      <input type="range" id="gap" min="30" max="70" step="0.5" value="50">
      <output id="gapOut">50%</output>
    </label>
    <label class="chk"><input type="checkbox" id="guides"> Show lug guides</label>
    <button id="pin">Pin this look</button>
  </div>

  <div class="target" id="target" role="group" aria-label="Use the next strap on">
    <span>Use strap on</span>
    <button data-t="both" class="on">Both</button><button data-t="top">Top</button><button data-t="bottom">Bottom</button>
  </div>

  <div id="strip" class="strip" aria-label="Strap history"></div>

  <h2>Pinned looks</h2>
  <div id="pins" class="pins"><p class="empty">Pin a combination to compare it here. Tap a pin to remove it.</p></div>
</main>

<script>
// ===== Set this to your deployed Worker URL (no trailing slash needed) =====
const WORKER = ""; // same origin: the Worker serves this page and the image proxy

const $ = s => document.querySelector(s);
const state = { guides: false, watch: null, straps: [], top: -1, bottom: -1, target: "both", gap: 0.5, manual: false };

// Background removal model (loads in the background; falls back to colour keying if unavailable)
let removeBg = null, bgError = null, cutMethod = "";
const bgReady = import("https://esm.sh/@imgly/background-removal@1.5.5")
  .then(m => (removeBg = m.removeBackground))
  .catch(e => { bgError = e; console.warn("Background model unavailable", e); });

const say = (t, err) => { const s = $("#status"); s.textContent = t; s.className = err ? "err" : ""; };

/* ---------- image helpers ---------- */
const loadImg = src => new Promise((res, rej) => {
  const i = new Image(); i.crossOrigin = "anonymous";
  i.onload = () => res(i); i.onerror = () => rej(new Error("Image failed to load"));
  i.src = src;
});
const newCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const px = c => c.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);

function toCanvas(img, max = 1400) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = newCanvas(img.naturalWidth * s, img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

function trimBars(c) { // crop flat dark bars/borders along the image edges
  const w = c.width, h = c.height, p = px(c).data;
  const dark = (x, y) => { const i = (y * w + x) * 4; return (p[i] + p[i + 1] + p[i + 2]) / 3 < 70; };
  const rowDark = y => { let k = 0; for (let x = 0; x < w; x++) if (dark(x, y)) k++; return k > w * 0.92; };
  const colDark = x => { let k = 0; for (let y = 0; y < h; y++) if (dark(x, y)) k++; return k > h * 0.92; };
  let t = 0, b = 0, l = 0, r = 0;
  while (t < h * 0.25 && rowDark(t)) t++;
  while (b < h * 0.25 && rowDark(h - 1 - b)) b++;
  while (l < w * 0.25 && colDark(l)) l++;
  while (r < w * 0.25 && colDark(w - 1 - r)) r++;
  if (!(t || b || l || r)) return c;
  const o = newCanvas(w - l - r, h - t - b);
  o.getContext("2d").drawImage(c, -l, -t);
  return o;
}

function closeGaps(bg, w, h) { // morphological closing of the subject: fills holes and notches up to a couple of percent of the picture, nothing wider
  const n = w * h, r = Math.max(3, Math.round(0.012 * Math.max(w, h)));
  const chamfer = set => { // approximate distance to the nearest set pixel, two passes
    const D = new Float32Array(n), a = 1, b = 1.4142;
    for (let k = 0; k < n; k++) D[k] = set[k] ? 0 : 1e9;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = y * w + x; let v = D[k];
      if (x > 0) v = Math.min(v, D[k - 1] + a);
      if (y > 0) v = Math.min(v, D[k - w] + a);
      if (x > 0 && y > 0) v = Math.min(v, D[k - w - 1] + b);
      if (x < w - 1 && y > 0) v = Math.min(v, D[k - w + 1] + b);
      D[k] = v;
    }
    for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
      const k = y * w + x; let v = D[k];
      if (x < w - 1) v = Math.min(v, D[k + 1] + a);
      if (y < h - 1) v = Math.min(v, D[k + w] + a);
      if (x < w - 1 && y < h - 1) v = Math.min(v, D[k + w + 1] + b);
      if (x > 0 && y < h - 1) v = Math.min(v, D[k + w - 1] + b);
      D[k] = v;
    }
    return D;
  };
  const fg = new Uint8Array(n);
  for (let k = 0; k < n; k++) fg[k] = bg[k] ? 0 : 1;
  const dFg = chamfer(fg), notDil = new Uint8Array(n);
  for (let k = 0; k < n; k++) notDil[k] = dFg[k] <= r ? 0 : 1; // grown subject
  const dOut = chamfer(notDil), out = new Uint8Array(n);
  for (let k = 0; k < n; k++) out[k] = dOut[k] > r ? 0 : 1;    // shrink it back: holes stay filled
  return out;
}

function floodKey(c, soft) { // fallback: remove background connected to the image border. soft = also follow soft shadows (for straps)
  const w = c.width, h = c.height, d = px(c), p = d.data;
  const border = []; // sample the frame: the backdrop, including however its brightness drifts across the picture
  for (let x = 0; x < w; x++) { border.push([x, 0]); border.push([x, h - 1]); }
  for (let y = 0; y < h; y++) { border.push([0, y]); border.push([w - 1, y]); }
  const plane = ch => { // least-squares fit  value = a + b*x + c*y
    let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0, sv = 0, svx = 0, svy = 0;
    for (const [x, y] of border) {
      const v = p[(y * w + x) * 4 + ch];
      n++; sx += x; sy += y; sxx += x * x; sxy += x * y; syy += y * y; sv += v; svx += v * x; svy += v * y;
    }
    const M = [[n, sx, sy], [sx, sxx, sxy], [sy, sxy, syy]], V = [sv, svx, svy];
    const det3 = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    const D = det3(M);
    if (!D) return [sv / n, 0, 0];
    const sub = k => det3(M.map((row, i) => row.map((v2, q) => (q === k ? V[i] : v2))));
    return [sub(0) / D, sub(1) / D, sub(2) / D];
  };
  const pr2 = plane(0), pg2 = plane(1), pb2 = plane(2);
  const bgAt = (x, y, pl) => pl[0] + pl[1] * x + pl[2] * y;
  const far = i => { // distance from the backdrop as estimated right at this spot
    const k = i >> 2, x = k % w, y = (k / w) | 0;
    return Math.hypot(p[i] - bgAt(x, y, pr2), p[i + 1] - bgAt(x, y, pg2), p[i + 2] - bgAt(x, y, pb2));
  };
  const step = (i, j) => Math.hypot(p[i] - p[j], p[i + 1] - p[j + 1], p[i + 2] - p[j + 2]);
  const bd = []; // what is left of the backdrop's own variation once the drift is accounted for
  for (const [x, y] of border) bd.push(far((y * w + x) * 4));
  bd.sort((a, b) => a - b);
  const spread = bd[Math.floor(bd.length * 0.9)];
  const T = Math.min(90, Math.max(70, 1.6 * spread + 26));   // a patch of backdrop is this close to the backdrop
  const F = Math.max(100, 1.6 * spread + 40);                // how far the backdrop may wander while being followed

  const flood = (init, ok) => {
    const bg = init ? init.slice() : new Uint8Array(w * h), st = [];
    if (init) { for (let k = 0; k < bg.length; k++) if (bg[k]) st.push(k); }
    else {
      const seed = (x, y) => { const k = y * w + x; if (!bg[k] && far(k * 4) < F) { bg[k] = 1; st.push(k); } };
      for (let x = 0; x < w; x++) { seed(x, 0); seed(x, h - 1); }
      for (let y = 0; y < h; y++) { seed(0, y); seed(w - 1, y); }
    }
    while (st.length) {
      const k = st.pop(), x = k % w, y = (k / w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const nk = ny * w + nx;
        if (!bg[nk] && ok(k, nk)) { bg[nk] = 1; st.push(nk); }
      }
    }
    return bg;
  };
  const count = bg => { let k = 0; for (let i = 0; i < bg.length; i++) if (!bg[i]) k++; return k; };
  // follow the backdrop inward one gentle step at a time: this copes with any falloff and never leaps
  // across a hard edge, so a reflective lug close in colour to the backdrop isn't taken just for matching it.
  // A bigger patch of backdrop reaching into the subject (e.g. the white page an iPad's bezel was cropped off
  // of) is instead handled by cutout()'s repeat: once this crops tight, the patch is border-connected again.
  let bg = flood(null, (k, nk) => step(k * 4, nk * 4) < 26 && far(nk * 4) < F);
  if (soft) { // straps: follow soft shadows too, but only if that doesn't eat into the strap itself
    const bg2 = flood(bg, (k, nk) => step(k * 4, nk * 4) < 20 && far(nk * 4) < 330);
    if (count(bg2) >= 0.6 * count(bg)) bg = bg2;
  }
  bg = closeGaps(bg, w, h); // mend narrow holes and nicks, e.g. a highlight on a slim lug that matches the backdrop
  const edge = new Uint8Array(w * h); // soften the 1px rim next to the background
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const k = y * w + x;
    if (!bg[k] && (bg[k - 1] || bg[k + 1] || bg[k - w] || bg[k + w])) edge[k] = 1;
  }
  for (let k = 0; k < w * h; k++) { if (bg[k]) p[k * 4 + 3] = 0; else if (edge[k]) p[k * 4 + 3] = 150; }
  c.getContext("2d").putImageData(d, 0, 0);
  return c;
}

function recoverEdges(ai, orig, soft) { // win back thin bits (lugs, prongs) the AI model dropped, by unioning with our own edge-follow cutout
  if (ai.width !== orig.width || ai.height !== orig.height) return ai; // sizes should match; bail out safely if they don't
  const w = ai.width, h = ai.height;
  const heurSrc = newCanvas(w, h);
  heurSrc.getContext("2d").drawImage(orig, 0, 0);
  const heur = floodKey(heurSrc, soft);
  const ad = px(ai), od = px(orig), hd = px(heur);
  // only trust the recovery close to where the AI model already found the subject: a thin lug or
  // prong sits right against the case, but a stray patch of backdrop our own flood missed could be
  // anywhere in the photo, so bound the rescue to a margin around the AI silhouette's own box.
  let bx0 = w, by0 = h, bx1 = -1, by1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (ad.data[(y * w + x) * 4 + 3] > 128) { if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y; }
  }
  if (bx1 < 0) return ai; // the AI model found nothing at all: nothing sensible to anchor a recovery to
  const mg = Math.round(0.3 * Math.max(bx1 - bx0 + 1, by1 - by0 + 1));
  const lx = Math.max(0, bx0 - mg), hx = Math.min(w - 1, bx1 + mg), ly = Math.max(0, by0 - mg), hy = Math.min(h - 1, by1 + mg);
  let added = false;
  for (let y = ly; y <= hy; y++) for (let x = lx; x <= hx; x++) {
    const i = (y * w + x) * 4 + 3;
    if (ad.data[i] > 128) continue;             // the AI model already kept this pixel
    if (hd.data[i] > 128) {                      // our own cutout thinks it's part of the subject, and it's near the AI shape: recover it
      ad.data[i - 3] = od.data[i - 3]; ad.data[i - 2] = od.data[i - 2]; ad.data[i - 1] = od.data[i - 1]; ad.data[i] = 255;
      added = true;
    }
  }
  if (added) ai.getContext("2d").putImageData(ad, 0, 0);
  return ai;
}

async function cutout(c, soft) {
  c = trimBars(c);
  await bgReady;
  if (removeBg) {
    try {
      const blob = await new Promise(r => c.toBlob(r, "image/png"));
      const out = await removeBg(blob, { model: "isnet_quint8" });
      cutMethod = "AI cutout";
      const ai = toCanvas(await loadImg(URL.createObjectURL(out)));
      return recoverEdges(ai, c, soft);
    } catch (e) { bgError = e; console.warn(e); }
  }
  cutMethod = "edge cutout";
  let out = crop(floodKey(c, soft));
  for (let pass = 0; pass < 3 && stillBackground(out); pass++) out = crop(floodKey(out, soft));
  return out;
}

function stillBackground(c) { // true when what is left is itself mostly a flat backdrop (a screen or page behind the subject)
  const w = c.width, h = c.height, d = px(c).data;
  let op = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 128) op++;
  if (op < 0.75 * w * h) return false;                       // already a subject-shaped cutout
  const bins = new Map();
  const add = (x, y) => {
    const i = (y * w + x) * 4; if (d[i + 3] < 128) return;
    const key = (d[i] >> 4) * 256 + (d[i + 1] >> 4) * 16 + (d[i + 2] >> 4);
    const e = bins.get(key) || [0, 0, 0, 0]; e[0]++; e[1] += d[i]; e[2] += d[i + 1]; e[3] += d[i + 2]; bins.set(key, e);
  };
  for (let x = 0; x < w; x++) { add(x, 0); add(x, h - 1); }
  for (let y = 0; y < h; y++) { add(0, y); add(w - 1, y); }
  if (!bins.size) return false;
  const top = [...bins.values()].sort((a, b) => b[0] - a[0])[0];
  const r = top[1] / top[0], g = top[2] / top[0], b = top[3] / top[0];
  let near = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128 && Math.hypot(d[i] - r, d[i + 1] - g, d[i + 2] - b) < 45) near++;
  return near > 0.45 * op;                                   // most of it is still one flat colour
}

function crop(c) {
  const { data: d } = px(c), w = c.width, h = c.height;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (d[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) throw new Error("Nothing found after background removal");
  const o = newCanvas(x1 - x0 + 1, y1 - y0 + 1);
  o.getContext("2d").drawImage(c, -x0, -y0);
  return o;
}

/* ---------- watch analysis ---------- */
function runs(d, w, y, minLen) {
  const r = []; let s = -1;
  for (let x = 0; x < w; x++) {
    const on = d[(y * w + x) * 4 + 3] > 128;
    if (on && s < 0) s = x;
    if (!on && s >= 0) { r.push([s, x - 1]); s = -1; }
  }
  if (s >= 0) r.push([s, w - 1]);
  return r.filter(a => a[1] - a[0] >= minLen);
}

function lugSide(d, w, h, fromBottom, ref) { // lug gap, centre and depth for one end; ref = other end, used to reject false matches
  const rows = [];
  for (let t = 0; t < h * 0.4; t++) {
    const r = runs(d, w, fromBottom ? h - 1 - t : t, w * 0.03);
    rows.push(r.length === 2 ? { gap: r[1][0] - r[0][1] - 1, cx: (r[0][1] + r[1][0]) / 2 } : null);
  }
  const med = a => a.slice().sort((p, q) => p - q)[a.length >> 1];
  const cands = []; let s = -1;
  for (let i = 0; i <= rows.length; i++) {
    const ok = i < rows.length && rows[i];
    if (ok && s < 0) s = i;
    if (!ok && s >= 0) {
      if (i - s >= 6) {
        const early = rows.slice(s, s + Math.max(4, Math.ceil((i - s) * 0.6)));
        cands.push({ gap: med(early.map(r => r.gap)), cx: med(early.map(r => r.cx)), join: i - 1 });
      }
      s = -1;
    }
  }
  if (!ref) return cands[0] || null;
  const score = c => Math.abs(c.gap - ref.gap) / ref.gap + Math.abs(c.cx - ref.cx) / w * 4;
  const best = cands.filter(c => Math.abs(c.gap - ref.gap) < ref.gap * 0.25 && Math.abs(c.cx - ref.cx) < w * 0.06)
                    .sort((p, q) => score(p) - score(q))[0];
  return best || { gap: ref.gap, cx: ref.cx, join: ref.join, copied: true };
}

function lightingCast(c) { // colour cast of the watch's near-neutral bright pixels (steel, white)
  const d = px(c).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 16) {
    if (d[i + 3] < 200) continue;

function uprightByLugs(c, maxDeg, info) { // turn the watch to the angle where both pairs of lugs read best: lugs up and down

function uprightByShape(c, maxDeg, minGain, info, minAspect) { // turn the shape to the angle where its silhouette is narrowest: for a watch that means lugs vertical

function flipV(c) { const o = newCanvas(c.width, c.height), x = o.getContext("2d"); x.translate(0, c.height); x.scale(1, -1); x.drawImage(c, 0, 0); return o; }

    o.getContext("2d").drawImage(c, horiz ? -keep[0] : 0, horiz ? 0 : -keep[0]);
    return keepOneStrap(crop(o));
  }
  return c;
}

function trimPins(c) { // crop a spring-bar pin that pokes out past the strap's own material at its attach end
  const w = c.width, h = c.height, ctx = c.getContext("2d"), im = ctx.getImageData(0, 0, w, h), d = im.data;
  const med = a => a.slice().sort((p, q) => p - q)[a.length >> 1];
  const y0 = Math.floor(h * 0.25), y1 = Math.ceil(h * 0.45); // a band well clear of the tip: the strap's own colour
  const R = [], G = [], B = [];
  for (let y = y0; y < y1; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (d[i + 3] > 128) { R.push(d[i]); G.push(d[i + 1]); B.push(d[i + 2]); } }
  if (R.length < 20) return c;
  const ref = [med(R), med(G), med(B)];
  const dist = (x, y) => { const i = (y * w + x) * 4; return d[i + 3] > 128 ? Math.hypot(d[i] - ref[0], d[i + 1] - ref[1], d[i + 2] - ref[2]) : 1e9; };
  const samp = []; for (let y = y0; y < y1; y += 2) for (let x = 0; x < w; x += 3) if (d[(y * w + x) * 4 + 3] > 128) samp.push(dist(x, y));
  samp.sort((p, q) => p - q);
  const tol = Math.max(45, 2.5 * (samp[Math.floor(samp.length * 0.9)] || 0)), gap = 3;
  const tip = Math.max(6, Math.round(h * 0.16));
  let cutTop = 0;
  for (; cutTop < tip; cutTop++) {
    let lo = -1, hi = -1;
    for (let x = 0; x < w; x++) if (d[(cutTop * w + x) * 4 + 3] > 128) { if (lo < 0) lo = x; hi = x; }
    if (lo < 0) continue; // nothing on this row yet
    let seen = false;
    for (let x = lo; x <= hi; x++) if (dist(x, cutTop) <= tol) { seen = true; break; }
    if (seen) break; // first row that shows the strap's own colour: a pin cap above this is gone, the rest stays
  }
  if (cutTop) for (let y = 0; y < cutTop; y++) for (let x = 0; x < w; x++) d[(y * w + x) * 4 + 3] = 0;
  for (let y = cutTop; y < tip; y++) { // trim a pin sticking out sideways past the strap's own edges on this row
    let lo = -1, hi = -1;
    for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 128) { if (lo < 0) lo = x; hi = x; }
    if (lo < 0) continue;
    let L = -1, Rt = -1, run = 0;
    for (let x = lo; x <= hi; x++) { if (dist(x, y) <= tol) { if (L < 0) L = x; Rt = x; run = 0; } else if (L >= 0 && ++run > gap) break; }
    if (L < 0) { for (let x = lo; x <= hi; x++) d[(y * w + x) * 4 + 3] = 0; continue; }
    for (let x = lo; x < L; x++) d[(y * w + x) * 4 + 3] = 0;
    for (let x = Rt + 1; x <= hi; x++) d[(y * w + x) * 4 + 3] = 0;
  }
  ctx.putImageData(im, 0, 0);
  return crop(c);
}

function prepStrap(raw, info) {
  const sub = {};
  let c = uprightByShape(crop(keepLargestPiece(raw, false, 3)), 90, 0.004, sub, 1.3);
  let deg = sub.deg || 0, why = sub.why;
  const whole = c;
  c = keepOneStrap(c);
  if (c !== whole) { // a piece was dropped: straighten the one that is left, and report THAT turn instead
    const sub2 = {};
    c = uprightByShape(c, 90, 0.004, sub2, 1.3);
    deg = sub2.deg || 0; why = sub2.why;
  }
  c = smoothEdges(tightenToStrap(c));
  if (spans(c, 0.85, 0.95) > spans(c, 0.05, 0.15)) c = flipV(c); // wider (lug) end on top
  c = trimPins(c);
  const box = spanBox(c, 0.04, 0.14);
  if (info) { info.deg = deg; info.why = why; }
  return { canvas: c, attachW: box.w, attachCx: box.cx };
}

/* ---------- rendering ---------- */
function preview(c) { // show an image large in the stage straight away
  const out = $("#stage"); out.width = c.width; out.height = c.height;
  const x = out.getContext("2d"); x.clearRect(0, 0, c.width, c.height); x.drawImage(c, 0, 0);
}

function tint(S, W) {
  if (S.tintedFor === W) return S.tinted;
  const f = W.cast.map(v => 1 + (v - 1) * 0.6);
  const c = newCanvas(S.canvas.width, S.canvas.height), x = c.getContext("2d");
  x.drawImage(S.canvas, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { p[i] = Math.min(255, p[i] * f[0]); p[i + 1] = Math.min(255, p[i + 1] * f[1]); p[i + 2] = Math.min(255, p[i + 2] * f[2]); }
  x.putImageData(d, 0, 0);
  S.tinted = c; S.tintedFor = W;
  return c;
}

function drawGuides(x, xw, y0, W) { // detected lug edges (vertical) and where the lugs meet the case (horizontal)
  const wh = W.canvas.height;
  x.save(); x.lineWidth = Math.max(2, W.canvas.width * 0.004);
  [["top", "#e0245e"], ["bottom", "#1a73e8"]].forEach(([side, col]) => {
    const L = W.lugs[side]; if (!L) return;
    const a = side === "top" ? y0 : y0 + wh - L.join, b = side === "top" ? y0 + L.join : y0 + wh;
    x.strokeStyle = col;
    x.beginPath();
    for (const dx of [-L.gap / 2, L.gap / 2]) { x.moveTo(xw + L.cx + dx, a); x.lineTo(xw + L.cx + dx, b); }
    const yj = side === "top" ? b : a;
    x.moveTo(xw + L.cx - L.gap / 2, yj); x.lineTo(xw + L.cx + L.gap / 2, yj);
    x.stroke();
  });
  x.restore();
}

function render() {
  const W = state.watch; if (!W) return;
  const out = $("#stage"), ww = W.canvas.width, wh = W.canvas.height;
  const ends = [
    { S: state.straps[state.top], L: W.lugs.top, up: true },
    { S: state.straps[state.bottom], L: W.lugs.bottom, up: false },
  ];
  if (!ends[0].S && !ends[1].S) {
    out.width = ww; out.height = wh;
    const x = out.getContext("2d"); x.drawImage(W.canvas, 0, 0);
    if (state.guides) drawGuides(x, 0, 0, W);
    return;
  }

  const ov = wh * 0.02, pad = Math.round(ww * 0.06);
  for (const e of ends) {
    if (!e.S) continue;
    const gap = state.manual || !e.L ? state.gap * ww : e.L.gap;
    e.cxl = e.L ? e.L.cx : ww / 2;
    e.join = (e.L ? e.L.join : wh * 0.1) + ov;
    e.k = gap / e.S.attachW;
    e.sw = e.S.canvas.width * e.k;
    e.len = Math.min(e.S.canvas.height * e.k, wh * 1.1 + e.join);
    e.prot = e.len - e.join;
  }
  const [T, B] = ends;
  const protT = T.S ? T.prot : 0, protB = B.S ? B.prot : 0;
  out.width = Math.round(Math.max(ww, T.S ? T.sw : 0, B.S ? B.sw : 0) + pad * 2);
  out.height = Math.round(wh + protT + protB + pad * 2);
  const xw = (out.width - ww) / 2, y0 = pad + protT;

  const L = newCanvas(out.width, out.height), l = L.getContext("2d");
  const fade = (yEnd, len, up) => {
    const f = len * 0.35, g = l.createLinearGradient(0, yEnd, 0, up ? yEnd + f : yEnd - f);
    g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    l.fillStyle = g; l.fillRect(0, up ? yEnd : yEnd - f, L.width, f);
  };
  if (T.S) {
    const tin = tint(T.S, W), ay = y0 + T.join;
    l.save(); l.translate(0, ay); l.scale(1, -1);
    l.drawImage(tin, 0, 0, tin.width, T.len / T.k, xw + T.cxl - T.S.attachCx * T.k, 0, T.sw, T.len);
    l.restore();
  }
  if (B.S) {
    const tin = tint(B.S, W), ay = y0 + wh - B.join;
    l.drawImage(tin, 0, 0, tin.width, B.len / B.k, xw + B.cxl - B.S.attachCx * B.k, ay, B.sw, B.len);
  }
  l.globalCompositeOperation = "destination-out";
  if (T.S) fade(y0 + T.join - T.len, T.len, true);
  if (B.S) fade(y0 + wh - B.join + B.len, B.len, false);

  const x = out.getContext("2d");
  x.drawImage(L, 0, 0);
  x.shadowColor = "rgba(0,0,0,.5)"; x.shadowBlur = ww * 0.03; x.shadowOffsetY = ww * 0.012;
  x.drawImage(W.canvas, xw, y0);
  x.shadowColor = "transparent";
  if (state.guides) drawGuides(x, xw, y0, W);
}

/* ---------- input handling ---------- */
async function fileToCanvas(blob) {
  const url = URL.createObjectURL(blob);
  try { return toCanvas(await loadImg(url)); } finally { URL.revokeObjectURL(url); }
}

async function setWatch(blob) {
  try {
    const raw = await fileToCanvas(blob);
    preview(raw);
    say("Removing the watch background… (the first run may download a model)");
    const turn = {};
    const cut = uprightByLugs(crop(keepLargestPiece(await cutout(raw), true)), 88, turn);
    const cov = (() => { const d = px(cut).data; let k = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 128) k++; return k / (cut.width * cut.height); })();
    if (cov > 0.9) { preview(cut); say(`Couldn't find the watch outline (${cutMethod}${bgError ? ", model error: " + (bgError.message || bgError) : ""}). Try a photo on a plain, evenly lit background.`, true); return; }
    const d = px(cut).data;
    const top = lugSide(d, cut.width, cut.height, false);
    const lugs = { top, bottom: lugSide(d, cut.width, cut.height, true, top) };
    const found = [lugs.top, lugs.bottom].filter(q => q && !q.copied);
    state.watch = { canvas: cut, cast: lightingCast(cut), lugs };
    state.manual = false;
    state.gap = found.length ? found.reduce((a, q) => a + q.gap, 0) / found.length / cut.width : 0.5;
    $("#gap").value = state.gap * 100; updateGapLabel();
    const pct = q => q ? Math.round(q.gap / cut.width * 100) + "%" + (q.copied ? " (copied from top)" : "") : "none";
    console.log("lugs", lugs, "turn", turn);
    const spin = Math.abs(turn.deg || 0) > 0.05 ? `Turned ${Math.round(Math.abs(turn.deg) * 10) / 10}\u00B0 upright. ` : turn.why ? `Not turned (${turn.why}). ` : "Lugs already level. ";
    say(spin + `Lug gap: top ${pct(lugs.top)}, bottom ${pct(lugs.bottom)}. ` + (found.length === 2 ? "Both pairs of lugs found." : found.length === 1 ? `Only the ${lugs.top ? "top" : "bottom"} lugs were found. Use the slider for the other end.` : "Couldn't find the lugs. Set the lug gap with the slider.") + ` Add a strap. (${cutMethod})`, !found.length);
    render();
  } catch (e) { say(e.message, true); }
}

async function addStrap(blob) {
  try {
    const raw = await fileToCanvas(blob);
    preview(raw);
    if (!state.watch) return say("Add a watch first, then add the strap again.", true);
    say("Preparing strap…");
    const turn = {};
    const s = prepStrap(await cutout(raw, true), turn);
    s.thumb = s.canvas.toDataURL();
    state.straps.push(s);
    applyStrap(state.straps.length - 1);
    const spin = Math.abs(turn.deg || 0) > 0.05 ? `Turned ${Math.round(Math.abs(turn.deg) * 10) / 10}\u00B0 upright. ` : turn.why ? `Not turned (${turn.why}). ` : "Already upright. ";
    say(spin + "Pick \u201CTop\u201D, \u201CBottom\u201D or \u201CBoth\u201D, then tap a strap to use it there.");
  } catch (e) { say(e.message, true); }
}

function applyStrap(i) {
  if (state.target !== "bottom") state.top = i;
  if (state.target !== "top") state.bottom = i;
  drawStrip(); render();
}

async function addStrapUrl(u) {
  try {
    say("Fetching image…");
    const r = await fetch(`${WORKER}/?url=${encodeURIComponent(u)}`);
    if (!r.ok) throw new Error("Couldn't fetch that link. It must point directly to an image.");
    await addStrap(await r.blob());
  } catch (e) { say(e.message, true); }
}

function drawStrip() {
  const el = $("#strip"); el.innerHTML = "";
  state.straps.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = i === state.top || i === state.bottom ? "on" : "";
    b.title = (i === state.top ? "Top " : "") + (i === state.bottom ? "Bottom" : "");
    b.innerHTML = `<img alt="Strap ${i + 1}" src="${s.thumb}">`;
    b.onclick = () => applyStrap(i);
    el.appendChild(b);
  });
}

function updateGapLabel() { $("#gapOut").textContent = (state.gap * 100).toFixed(1) + "%"; }

/* ---------- wiring ---------- */
$("#watchFile").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) await setWatch(f); };
$("#strapFile").onchange = async e => { const fs = [...e.target.files]; e.target.value = ""; for (const f of fs) await addStrap(f); };
$("#gap").oninput = e => { state.gap = e.target.value / 100; state.manual = true; updateGapLabel(); render(); };
$("#urlGo").onclick = () => { const v = $("#urlIn").value.trim(); if (v) { addStrapUrl(v); $("#urlIn").value = ""; } };
$("#guides").onchange = e => { state.guides = e.target.checked; render(); };
document.querySelectorAll("#target button").forEach(b => b.onclick = () => {
  state.target = b.dataset.t;
  document.querySelectorAll("#target button").forEach(x => x.classList.toggle("on", x === b));
});

function dropZone(el, onFiles, onUrl) {
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", async e => {
    e.preventDefault(); el.classList.remove("over");
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
    if (files.length) for (const f of files) await onFiles(f);
    else { const u = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text"); if (u && onUrl) onUrl(u.split("\n")[0].trim()); }
  });
}
dropZone($("#watchZone"), setWatch, null);
dropZone($("#strapZone"), addStrap, addStrapUrl);

addEventListener("paste", e => {
  if (e.target.tagName === "INPUT") return;
  const item = [...e.clipboardData.items].find(i => i.type.startsWith("image/"));
  if (item) return addStrap(item.getAsFile());
  const t = e.clipboardData.getData("text").trim();
  if (/^https?:\/\//.test(t)) addStrapUrl(t);
});

/* ---------- compare ---------- */
$("#pin").onclick = () => {
  if (!state.watch) return;
  const pins = $("#pins"); pins.querySelector(".empty")?.remove();
  const f = document.createElement("figure"), img = new Image();
  img.src = $("#stage").toDataURL(); img.alt = "Pinned look";
  f.appendChild(img);
  f.onclick = () => { f.remove(); if (!pins.children.length) pins.innerHTML = '<p class="empty">Pin a combination to compare it here. Tap a pin to remove it.</p>'; };
  pins.appendChild(f);
};

/* ---------- diagnostics ---------- */
addEventListener("error", e => say("Script error: " + e.message, true));
addEventListener("unhandledrejection", e => say("Error: " + (e.reason?.message || e.reason), true));
say("Ready. Add a watch to begin.");

</script>
</body>
</html>
